name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag set to deploy; e.g. PR number or prod"
        type: string
        default: 'prod'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  deploy-dev-airflow:
    name: Deploy Airflow (DEV)
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      airflow_fernet_key: ${{ secrets.AIRFLOW_FERNET_KEY }}
      airflow_flowworks_password: ${{ secrets.AIRFLOW_FLOWWORKS_PASSWORD }}
      airflow_flowworks_username: ${{ secrets.AIRFLOW_FLOWWORKS_USERNAME }}
      airflow_sendgrid_api_key: ${{ secrets.AIRFLOW_SENDGRID_API_KEY }}
      airflow_webserver_secret_key: ${{ secrets.AIRFLOW_WEBSERVER_SECRET_KEY }}

    with:
      directory: ./charts/openshift/airflow
      values: values.dev.yaml
      triggers: ('airflow/', 'charts/openshift/airflow/')
      timeout-minutes: 15

  # https://github.com/bcgov/quickstart-openshift-helpers
  deploy-test-application:
    name: Deploy Application (TEST)
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: test
      db_user: bcwat-api-read-only
      db_name: bcwat-test
      directory: ./charts/openshift/app
      values: values.test.yaml
      triggers: ('backend/' 'client/' 'migrations/' 'charts/openshift/app' 'charts/openshift/crunchy')
      timeout-minutes: 45

  deploy-test-airflow:
    name: Deploy Airflow (TEST)
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets: inherit
    with:
      environment: test
      directory: ./charts/openshift/airflow
      values: values.test.yaml
      triggers: ('airflow/', 'charts/openshift/airflow/')
      timeout-minutes: 15

  tests:
    name: Tests
    needs: [deploy-test-application]
    uses: ./.github/workflows/.system-tests.yml
    with:
      target: test

