name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'

  workflow_dispatch:
    # Image built is always test
concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-airflow:
    name: Build Matrix
    # needs: [unit_tests]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [airflow]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@v3.0.1
        with:
          keep_versions: 50
          package: ${{ matrix.package }}
          tags: latest
          # Latest Image used for dev/test/prod deploys
          # May be good to use semver

  deploy-dev-airflow:
    name: Deploy Airflow (DEV)
    needs: [build-airflow]                         # <- lets us read its outputs
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      airflow_fernet_key: ${{ secrets.AIRFLOW_FERNET_KEY }}
      airflow_flowworks_password: ${{ secrets.AIRFLOW_FLOWWORKS_PASSWORD }}
      airflow_flowworks_username: ${{ secrets.AIRFLOW_FLOWWORKS_USERNAME }}
      airflow_sendgrid_api_key: ${{ secrets.AIRFLOW_SENDGRID_API_KEY }}
      airflow_webserver_secret_key: ${{ secrets.AIRFLOW_WEBSERVER_SECRET_KEY }}
    with:
      directory: ./charts/openshift/airflow
      values: values.dev.yaml
      tag: dev
      timeout-minutes: 15

  builds:
    name: Build Matrix
    # needs: [unit_tests]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, client, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@v3.0.1
        with:
          keep_versions: 50
          package: ${{ matrix.package }}
          tags: test
          build_args:
            CLIENT_URL=https://${{ github.event.repository.name }}-test-frontend.apps.silver.devops.gov.bc.ca

  # https://github.com/bcgov/quickstart-openshift-helpers
  deploy-test-application:
    name: Deploy Application (TEST)
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: test
      tag: test
      db_user: bcwat-api-read-only
      db_name: bcwat-test
      directory: ./charts/openshift/app
      values: values.test.yaml
      timeout-minutes: 45

  deploy-test-airflow:
    name: Deploy Airflow (TEST)
    needs: [build-airflow, deploy-dev-airflow]
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets: inherit
    with:
      tag: latest
      environment: test
      directory: ./charts/openshift/airflow
      values: values.test.yaml
      timeout-minutes: 15

  tests:
    name: Tests
    needs: [deploy-test-application]
    uses: ./.github/workflows/.system-tests.yml
    with:
      target: test
