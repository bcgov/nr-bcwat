name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'

  workflow_dispatch:
    # Image built is always test
concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-airflow:
    name: Build Matrix
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [airflow, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@v3.0.1
        with:
          keep_versions: 50
          package: ${{ matrix.package }}
          tags: |
            dev
            test

  deploy-dev-airflow:
    name: Deploy Airflow (DEV)
    needs: [build-airflow]                         # <- lets us read its outputs
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      airflow_fernet_key: ${{ secrets.AIRFLOW_FERNET_KEY }}
      airflow_flowworks_password: ${{ secrets.AIRFLOW_FLOWWORKS_PASSWORD }}
      airflow_flowworks_username: ${{ secrets.AIRFLOW_FLOWWORKS_USERNAME }}
      airflow_sendgrid_api_key: ${{ secrets.AIRFLOW_SENDGRID_API_KEY }}
      airflow_api_secret_key: ${{ secrets.AIRFLOW_API_SECRET_KEY }}
      airflow_api_jwt_key: ${{ secrets.AIRFLOW_API_JWT_KEY }}
      ches_client_id: ${{ secrets.CHES_CLIENT_ID }}
      ches_client_secret: ${{ secrets.CHES_CLIENT_SECRET }}
    with:
      directory: ./charts/airflow
      values: values.dev.yaml
      tag: dev
      db_user: bcwat-api-admin
      db_name: bcwat-dev
      ches_api_url: ${{ vars.CHES_API_URL }}
      ches_login_url: ${{ vars.CHES_LOGIN_URL }}
      ches_from: ${{ vars.CHES_FROM }}
      ches_to: ${{ vars.CHES_TO }}
      ches_subject_prefix: ${{ vars.CHES_SUBJECT_PREFIX }}
      timeout-minutes: 45

  builds:
    name: Build Matrix
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, client, pdf-generator]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@v3.0.1
        with:
          keep_versions: 50
          package: ${{ matrix.package }}
          tags: test
          build_args:
            CLIENT_URL=https://${{ github.event.repository.name }}-test-frontend.apps.silver.devops.gov.bc.ca

  # https://github.com/bcgov/quickstart-openshift-helpers
  deploy-test-application:
    name: Deploy Application (TEST)
    needs: [builds]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: test
      tag: test
      db_user: bcwat-api-read-only
      db_name: bcwat-test
      client_url: https://${{ github.event.repository.name }}-test-frontend.apps.silver.devops.gov.bc.ca
      directory: ./charts/app
      values: values.test.yaml
      timeout-minutes: 15

  resolve-test-vars:
    name: Resolve Test Variables
    runs-on: ubuntu-latest
    environment: test
    outputs:
      ches_api_url: ${{ vars.CHES_API_URL }}
      ches_login_url: ${{ vars.CHES_LOGIN_URL }}
      ches_from: ${{ vars.CHES_FROM }}
      ches_to: ${{ vars.CHES_TO }}
      ches_subject_prefix: ${{ vars.CHES_SUBJECT_PREFIX }}
    steps:
      - run: echo "Fetch TEST Environment Variables..."

  # Limitation of Github Actions - Environment Variables cannot be inherited in the same way as secrets
  # The above step is done to ensure the proper CHES config's for TEST Env are passed into airflow deployer - otherwise, it would use the repository variables.
  deploy-test-airflow:
    name: Dploy Airflow (TEST)
    needs: [build-airflow, deploy-dev-airflow, resolve-test-vars]
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets: inherit
    with:
      tag: test
      environment: test
      directory: ./charts/airflow
      values: values.test.yaml
      db_user: bcwat-api-admin
      db_name: bcwat-test
      ches_api_url: ${{ needs.resolve-test-vars.outputs.ches_api_url }}
      ches_login_url: ${{ needs.resolve-test-vars.outputs.ches_login_url }}
      ches_from: ${{ needs.resolve-test-vars.outputs.ches_from }}
      ches_to: ${{ needs.resolve-test-vars.outputs.ches_to }}
      ches_subject_prefix: ${{ needs.resolve-test-vars.outputs.ches_subject_prefix }}
      timeout-minutes: 45

  tests:
    name: Tests
    needs: [deploy-test-application]
    uses: ./.github/workflows/.system-tests.yml
    with:
      target: test
