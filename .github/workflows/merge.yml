name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  # workflow_dispatch:
  #   inputs:
  #     tag:
  #       description: "Image tag set to deploy; e.g. PR number or test"
  #       type: string
  #       default: 'test'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-airflow:
    name: Build Matrix
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [airflow]
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.expose_tag.outputs.tag }}
    steps:
      - id: pr
        uses: bcgov/action-get-pr@v0.0.1
      - uses: bcgov/action-builder-ghcr@v3.0.1
        with:
          keep_versions: 50
          package: ${{ matrix.package }}
          tags: ${{ steps.pr.outputs.pr }}
          tag_fallback: latest
      - id: expose_tag
        run: echo "tag=${{ steps.pr.outputs.pr }}" >> "$GITHUB_OUTPUT"
      # now job output 'tag' == the PR tag

  deploy-dev-airflow:
    name: Deploy Airflow (DEV)
    needs: [build-airflow]                         # <- lets us read its outputs
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      airflow_fernet_key: ${{ secrets.AIRFLOW_FERNET_KEY }}
      airflow_flowworks_password: ${{ secrets.AIRFLOW_FLOWWORKS_PASSWORD }}
      airflow_flowworks_username: ${{ secrets.AIRFLOW_FLOWWORKS_USERNAME }}
      airflow_sendgrid_api_key: ${{ secrets.AIRFLOW_SENDGRID_API_KEY }}
      airflow_webserver_secret_key: ${{ secrets.AIRFLOW_WEBSERVER_SECRET_KEY }}
    with:
      directory: ./charts/openshift/airflow
      values: values.dev.yaml
      tag: ${{ needs.build-airflow.outputs.tag }}
      timeout-minutes: 15

  # https://github.com/bcgov/quickstart-openshift-helpers
  deploy-test-application:
    name: Deploy Application (TEST)
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: test
      tag: ${{ inputs.tag }}
      db_user: bcwat-api-read-only
      db_name: bcwat-test
      directory: ./charts/openshift/app
      values: values.test.yaml
      timeout-minutes: 45

  deploy-test-airflow:
    name: Deploy Airflow (TEST)
    needs: [build-airflow, deploy-dev-airflow]
    uses: ./.github/workflows/.airflow-deployer.yml
    secrets: inherit
    with:
      tag: ${{ needs.build-airflow.outputs.tag }}
      environment: test
      directory: ./charts/openshift/airflow
      values: values.test.yaml
      timeout-minutes: 15

  tests:
    name: Tests
    needs: [deploy-test-application]
    uses: ./.github/workflows/.system-tests.yml
    with:
      target: test

  promote:
    name: Promote Images To "Latest Tag"
    needs: [tests, deploy-test-application]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, client, airflow]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@v4 # v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.deploy-test-application.outputs.tag }}
          tags: latest

