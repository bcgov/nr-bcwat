name: "Prod: Deploy & Seed Database"

on:
  workflow_dispatch:

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
    deploys:
        name: Deploys Latest
        uses: ./.github/workflows/.db-deployer.yml
        secrets: inherit
        with:
            environment: prod
            directory: ./charts/openshift/crunchy
            name: bcwat-prod
            values: values.prod.yaml
            timeout-minutes: 30
