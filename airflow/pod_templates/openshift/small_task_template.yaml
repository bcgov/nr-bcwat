apiVersion: v1
kind: Pod
metadata:
  name: airflow-worker-simple
  labels:
    tier: airflow
    component: worker
    release: airflow
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  ttlSecondsAfterFinished: 300
  initContainers: []
  containers:
    - name: base
      image: apache/airflow:3.1.7
      imagePullPolicy: Always
      env:
        - name: AIRFLOW__CORE__EXECUTOR
          value: KubernetesExecutor
        - name: AIRFLOW__CORE__FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-fernet-key
              key: fernet-key
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: airflow-rw-db-conn
              key: connection
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: airflow-rw-db-conn
              key: connection
        - name: AIRFLOW_CONN_AIRFLOW_DB
          valueFrom:
            secretKeyRef:
              name: airflow-rw-db-conn
              key: connection
        - name: AIRFLOW__API__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-api-secret-key
              key: api-secret-key
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: airflow-jwt-secret
              key: jwt-secret
        - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_HOST
          value: airflow-webserver
        - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_PORT
          value: "8793"
        - name: FLOWWORKS_USER
          valueFrom:
            secretKeyRef:
              name: airflow-flowworks-credentials
              key: BCWAT_FLOWWORKS_USERNAME
        - name: FLOWWORKS_PASS
          valueFrom:
            secretKeyRef:
              name: airflow-flowworks-credentials
              key: BCWAT_FLOWWORKS_PASSWORD
        - name: AIRFLOW_CONN_BCWAT_DB
          valueFrom:
            secretKeyRef:
              name: bcwat-airflow-rw-db-conn
              key: connection
        - name: AIRFLOW_CONN_SENDGRID_DEFAULT
          valueFrom:
            secretKeyRef:
              name: airflow-sendgrid-default
              key: auth
        - name: AIRFLOW__EMAIL__EMAIL_BACKEND
          value: airflow.providers.sendgrid.utils.emailer.send_email
        - name: AIRFLOW__EMAIL__EMAIL_CONN_ID
          value: sendgrid_default
        - name: SENDGRID_MAIL_FROM
          value: airflow@foundryspatial.com
        - name: AIRFLOW__EMAIL__HTML_CONTENT_TEMPLATE
          value: "/opt/airflow/email_templates/content/openshift_content.html"
        - name: AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME
          value: "21600"
        - name: AIRFLOW__API_AUTH__JWT_LEEWAY
          value: "60"
      resources:
        requests:
          memory: 750Mi
        limits:
          memory: 750Mi
      volumeMounts:
        - mountPath: "/opt/airflow/logs"
          name: logs
        - name: config
          mountPath: "/opt/airflow/airflow.cfg"
          subPath: airflow.cfg
          readOnly: true
        - name: config
          mountPath: "/opt/airflow/config/airflow_local_settings.py"
          subPath: airflow_local_settings.py
          readOnly: true
        - name: data
          mountPath: "/opt/airflow/data"
          readOnly: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 600
  tolerations: []
  topologySpreadConstraints: []
  serviceAccountName: airflow-worker
  volumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs
    - name: config
      configMap:
        name: airflow-config
    - name: data
      persistentVolumeClaim:
        claimName: airflow-data
