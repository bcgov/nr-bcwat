executor: KubernetesExecutor

config:
  core:
    min_serialized_dag_update_interval: 300
    min_serialized_dag_fetch_interval: 60
  dag_processor:
    min_file_process_interval: 300
    refresh_interval: 3600

extraSecrets:
  airflow-flowworks-credentials:
    type: Opaque
    stringData: |
      BCWAT_FLOWWORKS_PASSWORD: "{{ .Values.secrets.bcwatFlowworks.password }}"
      BCWAT_FLOWWORKS_USERNAME: "{{ .Values.secrets.bcwatFlowworks.username }}"
  airflow-fernet-key:
    type: Opaque
    stringData: |
      fernet-key: "{{ .Values.secrets.fernet.key }}"
  airflow-api-secret-key:
    type: Opaque
    stringData: |
      api-secret-key: "{{ .Values.secrets.api.secretKey }}"
  airflow-jwt-secret:
    type: Opaque
    stringData: |
      jwt-secret: "{{ .Values.secrets.api.jwtKey }}"
  airflow-migrate-db-conn:
    type: Opaque
    stringData: |
      connection: {{ index ((lookup "v1" "Secret" .Release.Namespace "bcwat-test-crunchy-pguser-airflow-metadata-admin").data) "uri" | b64dec | quote }}
  airflow-rw-db-conn:
    type: Opaque
    stringData: |
      connection: {{ index ((lookup "v1" "Secret" .Release.Namespace "bcwat-test-crunchy-pguser-airflow-metadata-rw").data) "pgbouncer-uri" | b64dec | quote }}
  bcwat-airflow-rw-db-conn:
    type: Opaque
    stringData: |
      connection: {{ index ((lookup "v1" "Secret" .Release.Namespace "bcwat-test-crunchy-pguser-bcwat-airflow-read-write").data) "pgbouncer-uri" | b64dec | quote }}
  ches-credentials:
    type: Opaque
    stringData: |
      api-url: "{{ .Values.secrets.ches.apiUrl }}"
      login-url: "{{ .Values.secrets.ches.loginUrl }}"
      client-id: "{{ .Values.secrets.ches.clientId }}"
      client-secret: "{{ .Values.secrets.ches.clientSecret }}"
      from-address: "{{ .Values.secrets.ches.fromAddress }}"
      to-address: "{{ .Values.secrets.ches.toAddress }}"
      subject-prefix: "{{ .Values.secrets.ches.subjectPrefix }}"

fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret

data:
  metadataSecretName: airflow-rw-db-conn

logs:
  persistence:
    enabled: true
    storageClassName: netapp-file-standard
    size: 8Gi

airflowVersion: "3.1.7"

images:
  airflow:
    repository: ghcr.io/bcgov/nr-bcwat/airflow
    tag: latest
    pullPolicy: Always

securityContext:
  runAsUser: 1017950000
  fsGroup: 1017950000      # a value within the allowed fsGroup range (1017950000/10000)
networkPolicies:
  enabled: true
ingress:
  apiServer:
    enabled: true
    hosts:
      - name: "nr-bcwat-airflow-test.apps.silver.devops.gov.bc.ca"
        tls:
          enabled: true
    ingressClassName: "openshift-default"
apiServer:
  startupProbe:
    timeoutSeconds: 60
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: PLATFORM
      value: OPENSHIFT
    - name: AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME
      value: "21600"
    - name: AIRFLOW__API_AUTH__JWT_LEEWAY
      value: "60"
  networkPolicy:
    ingress:
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: "{{ .Values.ports.apiServer }}"
  extraInitContainers:
    - name: flyway-migrations
      image: "~"
      imagePullPolicy: Always
      env:
        - name: FLYWAY_URL
          valueFrom:
            secretKeyRef:
              name: "~"
              key: jdbc-uri
        - name: FLYWAY_USER
          valueFrom:
            secretKeyRef:
              name: "~"
              key: user
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "~"
              key: password
        - name: FLYWAY_BASELINE_ON_MIGRATE
          value: "true"
        - name: FLYWAY_DEFAULT_SCHEMA
          value: "USERS"
        - name: FLYWAY_CONNECT_RETRIES
          value: "10"
        - name: FLYWAY_GROUP
          value: "true"
  waitForMigrations:
    enabled: true

scheduler:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: PLATFORM
      value: OPENSHIFT
  waitForMigrations:
    enabled: true

migrateDatabaseJob:
  useHelmHooks: false
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
    - name: AIRFLOW_CONN_AIRFLOW_DB
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
  ttlSecondsAfterFinished: 180

createUserJob:
  useHelmHooks: false
  defaultUser:
    role: Admin
    username: "$(AIRFLOW_ADMIN_USER)"
    email: foundry@foundryspatial.com
    firstName: Foundry
    lastName: Admin
    password: "$(AIRFLOW_ADMIN_PASSWORD)"
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
    - name: AIRFLOW_CONN_AIRFLOW_DB
      valueFrom:
        secretKeyRef:
          name: airflow-migrate-db-conn
          key: connection
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-api-server-credentials
          key: airflow-admin-password
    - name: AIRFLOW_ADMIN_USER
      valueFrom:
        secretKeyRef:
          name: airflow-api-server-credentials
          key: airflow-admin-user
  ttlSecondsAfterFinished: 180

triggerer:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: PLATFORM
      value: OPENSHIFT
  persistence:
    enabled: false
  waitForMigrations:
    enabled: true
podTemplate: |
  apiVersion: v1
  kind: Pod
  metadata:
    name: airflow-worker-simple
    labels:
      tier: airflow
      component: worker
      release: airflow
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  spec:
    ttlSecondsAfterFinished: 300
    initContainers: []
    containers:
      - name: base
        image: apache/airflow:3.1.7
        imagePullPolicy: Always
        env:
          - name: AIRFLOW__CORE__EXECUTOR
            value: KubernetesExecutor
          - name: AIRFLOW__CORE__FERNET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-fernet-key
                key: fernet-key
          - name: AIRFLOW_HOME
            value: /opt/airflow
          - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
            valueFrom:
              secretKeyRef:
                name: airflow-rw-db-conn
                key: connection
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            valueFrom:
              secretKeyRef:
                name: airflow-rw-db-conn
                key: connection
          - name: AIRFLOW_CONN_AIRFLOW_DB
            valueFrom:
              secretKeyRef:
                name: airflow-rw-db-conn
                key: connection
          - name: AIRFLOW__API__SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-api-secret-key
                key: api-secret-key
          - name: AIRFLOW__API_AUTH__JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: airflow-jwt-secret
                key: jwt-secret
          - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_HOST
            value: airflow-webserver
          - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_PORT
            value: "8793"
          - name: FLOWWORKS_USER
            valueFrom:
              secretKeyRef:
                name: airflow-flowworks-credentials
                key: BCWAT_FLOWWORKS_USERNAME
          - name: FLOWWORKS_PASS
            valueFrom:
              secretKeyRef:
                name: airflow-flowworks-credentials
                key: BCWAT_FLOWWORKS_PASSWORD
          - name: AIRFLOW_CONN_BCWAT_DB
            valueFrom:
              secretKeyRef:
                name: bcwat-airflow-rw-db-conn
                key: connection
          - name: AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME
            value: "21600"
          - name: AIRFLOW__API_AUTH__JWT_LEEWAY
            value: "60"
          - name: AIRFLOW__API__BASE_URL
            value: "https://nr-bcwat-airflow-test.apps.silver.devops.gov.bc.ca"
          - name: CHES_API_URL
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: api-url
          - name: CHES_LOGIN_URL
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: login-url
          - name: CHES_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: client-id
          - name: CHES_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: client-secret
          - name: CHES_FROM
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: from-address
          - name: CHES_TO
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: to-address
          - name: CHES_SUBJECT_PREFIX
            valueFrom:
              secretKeyRef:
                name: ches-credentials
                key: subject-prefix
          - name: PLATFORM
            value: OPENSHIFT
          - name:
        resources:
          requests:
            memory: 2048Mi
          limits:
            memory: 2048Mi
        volumeMounts:
          - mountPath: "/opt/airflow/logs"
            name: logs
          - name: config
            mountPath: "/opt/airflow/airflow.cfg"
            subPath: airflow.cfg
            readOnly: true
          - name: config
            mountPath: "/opt/airflow/config/airflow_local_settings.py"
            subPath: airflow_local_settings.py
            readOnly: true
          - name: data
            mountPath: "/opt/airflow/data"
            readOnly: false
    restartPolicy: Never
    terminationGracePeriodSeconds: 600
    tolerations: []
    topologySpreadConstraints: []
    serviceAccountName: airflow-worker
    volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: airflow-logs
      - name: config
        configMap:
          name: airflow-config
      - name: data
        persistentVolumeClaim:
          claimName: airflow-file-mount

redis:
  enabled: false

postgresql:
  enabled: false

flower:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false

