executor: KubernetesExecutor

extraSecrets:
  airflow-flowworks-credentials:
    type: Opaque
    stringData: |
      BCWAT_FLOWWORKS_PASSWORD: "{{ .Values.secrets.bcwatFlowworks.password }}"
      BCWAT_FLOWWORKS_USERNAME: "{{ .Values.secrets.bcwatFlowworks.username }}"
  airflow-fernet-key:
    type: Opaque
    stringData: |
      fernet-key: "{{ .Values.secrets.fernet.key }}"
  airflow-sendgrid-default:
    type: Opaque
    stringData: |
      auth: '{
          "conn_type": "sendgrid",
          "password": "{{ .Values.secrets.sendgridApiKey }}"
      }'
# We are manaully creating a fernet-key before initializing Airflow.
fernetKeySecretName: airflow-fernet-key

# Airflow database config
# Requires Airflow-metadata secret to have been created, pointing to the external database handling airflow metadata info
data:
  metadataSecretName: airflow-database-connection
  resultBackendSecretName: airflow-database-connection

registry:
  secretName: acr-pull-secret

airflowVersion: "2.10.5"

images:
  airflow:
    repository: foundrymainregistry.azurecr.io/bcwat/airflow
    tag: latest
    pullPolicy: Always

migrateDatabaseJob:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  ttlSecondsAfterFinished: 180

createUserJob:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  ttlSecondsAfterFinished: 180

redis:
  enabled: false

postgresql:
  enabled: false

flower:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false

# Requires Existing Storage Class Created (handled by FLUX CD - INFRA)
logs:
  persistence:
    enabled: true
    storageClassName: airflow

webserver:
  livenessProbe:
    initialDelaySeconds: 60
  readinessProbe:
    initialDelaySeconds: 60
  startupProbe:
    initialDelaySeconds: 30
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  extraInitContainers:
    - name: bcwat-api-init
      image: "{{ .Values.migrations.image }}"
      imagePullPolicy: Always
      env:
      - name: FLYWAY_URL
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: jdbc-uri
      - name: FLYWAY_USER
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: user
      - name: FLYWAY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: password
      resources:
        requests:
          cpu: 50m
          memory: 75Mi
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

scheduler:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

triggerer:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  persistence:
    enabled: false
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
