executor: KubernetesExecutor

extraSecrets:
  airflow-flowworks-credentials:
    type: Opaque
    stringData: |
      BCWAT_FLOWWORKS_PASSWORD: "{{ .Values.secrets.bcwatFlowworks.password }}"
      BCWAT_FLOWWORKS_USERNAME: "{{ .Values.secrets.bcwatFlowworks.username }}"
  airflow-fernet-key:
    type: Opaque
    stringData: |
      fernet-key: "{{ .Values.secrets.fernet.key }}"
  airflow-api-secret-key:
    type: Opaque
    stringData: |
      api-secret-key: "{{ .Values.secrets.api.secretKey }}"
  airflow-jwt-secret:
    type: Opaque
    stringData: |
      jwt-secret: "{{ .Values.secrets.api.jwtKey }}"
  airflow-sendgrid-default:
    type: Opaque
    stringData: |
      auth: '{
          "conn_type": "sendgrid",
          "password": "{{ .Values.secrets.sendgridApiKey }}"
      }'

fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret

# Airflow database config
# Requires Airflow-metadata secret to have been created, pointing to the external database handling airflow metadata info
data:
  metadataSecretName: airflow-database-connection

registry:
  secretName: acr-pull-secret

airflowVersion: "3.1.7"

images:
  airflow:
    repository: foundrymainregistry.azurecr.io/bcwat/airflow
    tag: latest
    pullPolicy: Always

redis:
  enabled: false

postgresql:
  enabled: false

flower:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false

# Requires Existing Storage Class Created (handled by FLUX CD - INFRA)
logs:
  persistence:
    enabled: true
    storageClassName: airflow

migrateDatabaseJob:
  useHelmHooks: false
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  ttlSecondsAfterFinished: 180

createUserJob:
  useHelmHooks: false
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  ttlSecondsAfterFinished: 180

apiServer:
  startupProbe:
    timeoutSeconds: 60
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  extraInitContainers:
    - name: bcwat-api-init
      image: "{{ .Values.migrations.image }}"
      imagePullPolicy: Always
      env:
      - name: FLYWAY_URL
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: jdbc-uri
      - name: FLYWAY_USER
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: user
      - name: FLYWAY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bcwat-api-admin-credentials
            key: password
      resources:
        requests:
          cpu: 50m
          memory: 75Mi
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
dagProcessor:
  env:
    - name: ENVIRONMENT
      value: OKD

scheduler:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

triggerer:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
    - name: ENVIRONMENT
      value: OKD
  persistence:
    enabled: false
  waitForMigrations:
    enabled: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
