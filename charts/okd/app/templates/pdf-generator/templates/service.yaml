apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.pdfGenerator.name }}-svc"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.pdfGenerator.name }}
    project: {{ .Values.global.project }}
spec:
  selector:
    app: {{ .Values.pdfGenerator.name }}
  ports:
    - port: 8888
      targetPort: 8888
  type: ClusterIP
