global:
  project: bcwat
  namespace: bcwat
  imagePullSecret: acr-pull-secret

frontend:
  name: bcwat-frontend
  image: foundrymainregistry.azurecr.io/bcwat/nginx:latest
  port: 8081
  targetPort: 8081

configMap:
  name: nginx-conf
  LOG_LEVEL: debug

backend:
  name: bcwat-api
  image: foundrymainregistry.azurecr.io/bcwat/api:latest
  secret: bcwat-api-credentials
  env:
    FLASK_ENV: Development
    CLIENT_URL: http://bcwatertool.fspatial

pdfGenerator:
  name: bcwat-pdf-generator
  image: foundrymainregistry.azurecr.io/bcwat/pdf-generator:latest
