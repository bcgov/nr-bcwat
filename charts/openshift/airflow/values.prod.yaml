executor: KubernetesExecutor

extraSecrets:
  airflow-flowworks-credentials:
    type: Opaque
    stringData: |
      BCWAT_FLOWWORKS_PASSWORD: "{{ .Values.secrets.bcwatFlowworks.password }}"
      BCWAT_FLOWWORKS_USERNAME: "{{ .Values.secrets.bcwatFlowworks.username }}"
  airflow-fernet-key:
    type: Opaque
    stringData: |
      fernet-key: "{{ .Values.secrets.fernet.key }}"
  airflow-webserver-secret-key:
    type: Opaque
    stringData: |
      webserver-secret-key: "{{ .Values.secrets.webserver.key }}"
  airflow-database-connection:
    type: Opaque
    stringData: |
      connection: {{ index ((lookup "v1" "Secret" .Release.Namespace "bcwat-prod-crunchy-pguser-airflow-metadata-admin").data) "uri" | b64dec | quote }}
  airflow-conn-bcwat-db:
    type: Opaque
    stringData: |
      uri: {{ index ((lookup "v1" "Secret" .Release.Namespace "bcwat-prod-crunchy-pguser-bcwat-airflow-read-write").data) "pgbouncer-uri" | b64dec | quote }}
  airflow-sendgrid-default:
    type: Opaque
    stringData: |
      auth: '{
          "conn_type": "sendgrid",
          "password": "{{ .Values.secrets.sendgridApiKey }}"
      }'

fernetKeySecretName: airflow-fernet-key
webserverSecretKeySecretName: airflow-webserver-secret-key

data:
  metadataSecretName: airflow-database-connection
  resultBackendSecretName: airflow-database-connection

logs:
  persistence:
    enabled: true
    storageClassName: netapp-file-standard
    size: 8Gi

images:
  airflow:
    repository: ghcr.io/bcgov/nr-bcwat/airflow
    tag: latest
    pullPolicy: Always

webserver:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  waitForMigrations:
    enabled: false
  securityContext:
    runAsUser: 1017940000
    fsGroup: 1017940000      # a value within the allowed fsGroup range (1017940000/10000)

scheduler:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  waitForMigrations:
    enabled: false
  securityContext:
    runAsUser: 1017940000
    fsGroup: 1017940000      # a value within the allowed fsGroup range (1017940000/10000)

migrateDatabaseJob:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsUser: 1017940000
    fsGroup: 1017940000      # a value within the allowed fsGroup range (1017940000/10000)
  ttlSecondsAfterFinished: 180

createUserJob:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  securityContext:
    runAsUser: 1017940000
    fsGroup: 1017940000      # a value within the allowed fsGroup range (1017940000/10000)
  ttlSecondsAfterFinished: 180

redis:
  enabled: false

triggerer:
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "False"
  persistence:
    enabled: false
  waitForMigrations:
    enabled: false
  securityContext:
    runAsUser: 1017940000
    fsGroup: 1017940000      # a value within the allowed fsGroup range (1017940000/10000)

postgresql:
  enabled: false

flower:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false
