services:
  bcwat-client-service:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        CLIENT_URL: http://localhost:5173
    env_file:
      - ./client/.env
    environment:
      - VITE_BASE_API_URL=/api
    volumes:
      - "./client/nginx.conf:/etc/nginx/nginx.conf"
    ports:
      - 5173:3000
    depends_on:
      - bcwat-api-service

  bcwat-api-service:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - CLIENT_URL=http://bcwat-client-service:3000
      - PDF_CONVERTER_ENDPOINT=http://bcwat-pdf-generator-service:8888
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bcwat-pdf-generator-service

  bcwat-pdf-generator-service:
    build: ./pdf-generator
    env_file:
      - ./pdf-generator/.env
    environment:
      - CLIENT_URL=http://bcwat-client-service:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
